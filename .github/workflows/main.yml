name: My personal workflow project

on:
  push:
    branches:
      - main 

  pull_request:
    branches: ["main"]

env:
  ECR_REPOSITORY: 'gitactionproject-appimage'

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: code checkout
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install python packages
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt

      - name: execute py script
        env:
           SOME_SECRET: ${{ secrets.SOME_SECRET }}
        run: python app/calculator.py

      - name: Package Python application
        run: zip -r python-app.zip app/ requirements.txt

      - name: Upload Build Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with: 
            name: gitaction-python-project
            path: python-app.zip

      - name: Notify if build fails
        if: failure()
        run: echo "🚨🚨Build job failed! Please check logs"

  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r requirements.txt

      - name: Run tests
        run: pytest app/

      - name: Check code style
        run: flake8 .

  Security_Scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          vuln-type: "os,library"
          output: trivy-results.json

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-result
          path: trivy-results.json

  BUILD_AND_PUBLISH:
    name: BUILD_AND_PUBLISH
    runs-on: ubuntu-latest
    environment: production
    needs: [build, Testing, Security_Scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{vars.AWS_REGION}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gitactionproject-appimage
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Docker-files/multistage/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
         

