name: My personal workflow project

on:
  push:
    branches:
      - main 

  pull_request:
    branches: ["main"]

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: code checkout
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install python packages
        run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt

      - name: execute py script
        env:
           SOME_SECRET: ${{ secrets.SOME_SECRET }}
        run: python app/calculator.py

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v4
        with: 
            name: gitaction:project
            path: target/*.war

      - name: Notify if build fails
        if: failure()
        run: echo "🚨🚨Build job failed! Please check logs"

  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r requirements.txt

      - name: Run tests
        run: pytest app/

      - name: Check code style
        run: flake8 .

  Security_Scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          vuln-type: os, library
          output: trivy-results.json

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json